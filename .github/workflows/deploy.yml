# .github/workflows/deploy.yml

name: Deploy to GitHub Pages

# mainブランチにpushされた時にこのワークフローを実行するよ
on:
  push:
    branches:
      - main
  # Actionsタブから手動で実行することもできるよ
  workflow_dispatch:

# 権限の設定：デプロイに必要だよ
permissions:
  contents: read
  pages: write
  id-token: write

# 実行する一連のタスク（ジョブ）
jobs:
  # ビルドしてデプロイするジョブ
  build-and-deploy:
    runs-on: ubuntu-latest # 実行環境はUbuntu
    steps:
      - name: Checkout repository # ① コードをチェックアウト
        uses: actions/checkout@v4

      - name: Setup Node.js # ② Node.jsの環境をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 使うNode.jsのバージョン
          cache: 'npm' # npmのキャッシュを有効にする

      - name: Install dependencies # ③ 依存パッケージをインストール
        run: npm install

      - name: Build project # ④ プロジェクトをビルド
        # Viteを使ってる場合は、package.jsonのhomepageに合わせてbaseを設定する必要があるかも！
        # 例: run: npm run build -- --base=/${{ github.event.repository.name }}/
        run: npm run build

      - name: Upload artifact # ⑤ ビルド成果物をアップロードしてPagesで使えるようにする
        uses: actions/upload-pages-artifact@v3
        with:
          # ここにビルド成果物が入っているフォルダのパスを書く
          path: './dist'

      - name: Deploy to GitHub Pages # ⑥ GitHub Pagesにデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
